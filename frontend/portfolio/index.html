    <!--
      ╔══════════════════════════════════════════════════════════════╗
      ║  PRE-HYDRATION THEME SCRIPT                                  ║
      ║  Reads localStorage BEFORE React mounts to set              ║
      ║  data-version and data-mode on <html>.                      ║
      ║  This eliminates any flash of the wrong theme.              ║
      ╚══════════════════════════════════════════════════════════════╝
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var version = localStorage.getItem('portfolio_theme_version') || 'v2';
        var mode    = localStorage.getItem('portfolio_theme_mode')    || 'system';

        // Resolve 'system' to actual mode
        var resolved = mode;
        if (mode === 'system') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        root.setAttribute('data-version', version);
        root.setAttribute('data-mode', resolved);

        // Sync theme-color meta immediately
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) {
          if (version === 'v1') {
            themeColorMeta.content = resolved === 'dark' ? '#000000' : '#fdf8e7';
          } else {
            themeColorMeta.content = resolved === 'dark' ? '#0f172a' : '#f8fafc';
          }
        }
      })();
    </script>
  </head>
  <body class="antialiased overflow-x-hidden">
